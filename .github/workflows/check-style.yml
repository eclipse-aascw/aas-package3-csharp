name: Check style

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

  push:
    branches:
      - main

jobs:
  Check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Display repository name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          Write-Host "The repository is: ${env:REPOSITORY}"

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'  # ReSharper CLT 2026.3 requires .NET 10

      - name: Install dotnet tools
        working-directory: src
        run: dotnet tool restore

      - name: Check format
        working-directory: src
        run: powershell .\CheckFormat.ps1

      - name: Build for inspection
        working-directory: src
        run: dotnet build -c DebugSlow

      - name: Inspect code
        working-directory: src
        run: powershell .\InspectCode.ps1
