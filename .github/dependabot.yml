version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    ignore:
      # System.IO.Packaging is a runtime dependency of the published package.
      # Its major versions follow .NET and drop older target frameworks, so
      # raising it forces all consumers onto it. We follow the .NET LTS
      # releases and bump it deliberately together with the target
      # frameworks of the library in a major release instead.
      - dependency-name: "System.IO.Packaging"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns:
          - "*"
